[package]
name = "manelismo-bot-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-rt = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
dotenv = "0.15"
log = "0.4"
env_logger = "0.11"
cors = "0.4"
actix-cors = "0.7"

[[bin]]
name = "manelismo_bot_backend"
path = "src/main.rs"
