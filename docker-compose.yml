
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: manelismo-bot-backend
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - OLLAMA_HOST=127.0.0.1:11434
      - OLLAMA_MODEL=tinyllama
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - manelismo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_API_URL: http://localhost:8080
    container_name: manelismo-bot-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - manelismo-network

networks:
  manelismo-network:
    driver: bridge

volumes:
  ollama-data:
